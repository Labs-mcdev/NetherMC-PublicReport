# Maintainers: Keep restriction types and appeal fields aligned with the reporting README.
name: Sanction appeal
description: Request review of a Join Block, Feature Block, or SubServer Block you believe was mistaken.
body:
  - type: markdown
    attributes:
      value: |
        Read the [appeal instructions](https://github.com/Labs-mcdev/NetherMC-PublicReport#sanction-appeals) and [server and community rules](https://github.com/SchemaFoxLabs/NetherMC/blob/main/docs/SERVER_RULES.md). Appeals are reviewed against the relevant rules, facts, and evidence.

        Provide only redacted material. Do not publish private account details, passwords, authentication codes, or unrelated personal information.

  - type: dropdown
    id: sanction_type
    attributes:
      label: Restriction type
      options:
        - Join Block
        - Feature Block
        - SubServer Block
      description: Join Block prevents network entry; Feature Block restricts a feature such as chat or Ranked; SubServer Block restricts a specific subserver.
    validations:
      required: true
  - type: input
    id: affected_area
    attributes:
      label: Affected subserver or feature
      description: Identify the subserver or restricted feature; for a network-wide restriction, state network-wide.
    validations:
      required: true
  - type: input
    id: player_id
    attributes:
      label: Player ID (optional)
      description: If you leave this blank, request a private contact method (PM if available) in the public Issue and provide the ID only through that private method. Do not publish sensitive identifiers.
      placeholder: "Optional; leave blank if it should not be public"
  - type: input
    id: time
    attributes:
      label: Approximate sanction time (UTC-8)
      description: Use the fixed UTC-8 offset. If unknown, say so.
      placeholder: "YYYY-MM-DD HH:mm UTC-08:00"
    validations:
      required: true
  - type: textarea
    id: displayed_reason
    attributes:
      label: Displayed reason
      description: Give the reason shown, removing private identifiers. If no reason was shown, say so.
    validations:
      required: true
  - type: textarea
    id: appeal_reason
    attributes:
      label: Grounds for appeal
      description: Explain why you believe the decision was mistaken and the relevant context.
    validations:
      required: true
  - type: textarea
    id: supporting_material
    attributes:
      label: Redacted supporting material (optional)
      description: Add relevant redacted screenshots or other non-sensitive context. Ask before submitting any supplementary material that cannot be public.
  - type: checkboxes
    id: confirmation
    attributes:
      label: Before submitting
      options:
        - label: I have read the appeal instructions and removed private account information and credentials from this public appeal.
          required: true
