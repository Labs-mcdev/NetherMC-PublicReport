# Maintainers: Keep this form free of media requests at every confidence level; require a valid in-game Report-ID.
name: Player report without media evidence
description: Report CSAM Content or Illegal PlayerID using a valid in-game Report-ID and non-graphic context.
body:
  - type: markdown
    attributes:
      value: |
        Read the [reporting instructions](https://github.com/Labs-mcdev/NetherMC-PublicReport#player-reports) and [server and community rules](https://github.com/SchemaFoxLabs/NetherMC/blob/main/docs/SERVER_RULES.md).

        A valid in-game Report-ID is required. Staff check the associated game records to identify the reporter and reported player; possessing the ID alone does not complete identity verification. Streamer Mode hides the relevant chat display. View My Reports with `/report-mylist`. Old reports are periodically cleared: if the original ID is unavailable, use `/inforeport` **on the subserver where the reported player committed the violation** to obtain a new ID. Still give the original incident time; a new ID does not restore cleared records.

        **No media evidence is required.** For CSAM, do not download, copy, upload, forward, or link to the material for reporting. Obtaining, possessing, or sharing it may violate applicable law and platform rules. Provide only non-graphic locating information. Illegal skins must be reported in-game only.
  - type: input
    id: report_id
    attributes:
      label: In-game Report-ID
      description: Enter a valid ID linked to the in-game report. Use /report-mylist to find it, or /inforeport on the incident subserver if the original is no longer available. Do not enter a placeholder.
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Violation type
      options:
        - CSAM Content
        - Illegal PlayerID
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Incident subserver
      description: Identify the subserver where the original conduct occurred.
      placeholder: "Example: Practice (practice)"
    validations:
      required: true
  - type: input
    id: mode
    attributes:
      label: Relevant game mode or feature
      description: Identify Ranked, Unranked, chat, or the relevant feature.
    validations:
      required: true
  - type: input
    id: time
    attributes:
      label: Original incident time (UTC-8)
      description: Give the original incident time using the fixed UTC-8 offset, even if you obtained a new ID later. If approximate, say so.
      placeholder: "YYYY-MM-DD HH:mm UTC-08:00"
    validations:
      required: true
  - type: textarea
    id: incident_context
    attributes:
      label: Non-graphic incident context
      description: Explain where and when the issue was encountered, with enough non-graphic context to locate the game record. Do not repeat private or abusive identifiers publicly. No screenshots, recordings, or links to CSAM.
    validations:
      required: true
  - type: dropdown
    id: confidence
    attributes:
      label: Confidence
      description: Your assessment, not a staff finding. Higher confidence requires more complete and verifiable information.
      options:
        - I thought
        - Vague evidence
        - Highly suspected
        - Blatant violations
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        **I thought:** specific non-graphic leads; distinguish observation from assumption.
        **Vague evidence:** relevant but incomplete non-graphic information; explain limitations.
        **Highly suspected:** mutually supporting or continuous non-graphic context.
        **Blatant violations:** precise, sufficient non-graphic information allowing staff to directly check the key conduct against game records.
        Higher confidence never requires collecting or submitting restricted media. Insufficient information is not automatically abusive reporting.
  - type: textarea
    id: confidence_basis
    attributes:
      label: Basis for this confidence level
      description: Explain how the information supports your selection, including uncertainty, missing context, and limitations. Do not infer guilt from online opinion or report counts.
    validations:
      required: true
  - type: textarea
    id: locating_information
    attributes:
      label: Additional non-graphic locating information (optional)
      description: Add relevant timing or feature context without media, sensitive identities, or links to restricted material.
  - type: checkboxes
    id: confirmation
    attributes:
      label: Before submitting
      options:
        - label: I have provided a valid in-game Report-ID and accurately described the original incident.
          required: true
        - label: I have not uploaded or linked CSAM and have removed private information from this public report.
          required: true
